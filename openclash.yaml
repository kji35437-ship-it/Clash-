# ===============================
# 基础设置
# ===============================

port: 7890
socks-port: 7891
mixed-port: 7893

allow-lan: true
bind-address: "*"

mode: rule
log-level: info

ipv6: false

tcp-concurrent: true
unified-delay: true

find-process-mode: strict

global-client-fingerprint: chrome


# ===============================
# 控制面板
# ===============================

external-controller: 0.0.0.0:9090


# ===============================
# Profile
# ===============================

profile:
  store-selected: true
  store-fake-ip: true


# ===============================
# DNS
# ===============================

dns:
  enable: true

  listen: 127.0.0.1:7875

  ipv6: false

  enhanced-mode: fake-ip

  fake-ip-range: 198.18.0.1/16


  default-nameserver:
    - 223.5.5.5
    - 114.114.114.114


  nameserver:
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query


  fallback:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query


  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4


# ===============================
# 节点订阅
# ===============================

proxy-providers:


  Provider_1:
    type: http
    url: https://raw.githubusercontent.com/PuddinCat/BestClash/refs/heads/main/proxies.yaml
    interval: 3600
    path: ./providers/Provider_1.yaml

    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300

    header:
      User-Agent:
        - clash.meta


