# ===============================
# 策略组
# ===============================

proxy-groups:


# 总入口

  - name: 🚀 节点选择
    type: select
    proxies:
      - ⚡ 自动测速
      - 所有-手动
      - 香港-自动
      - 台湾-自动
      - 日本-自动
      - 新加坡-自动
      - 韩国-自动
      - 美国-自动
      - DIRECT


# 自动测速

  - name: ⚡ 自动测速
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 80
    use:
      - Provider_1
      - Provider_2
      - Provider_3
      - Provider_4
      - Provider_5
      - Provider_6
      - Provider_7


# 全部手动

  - name: 所有-手动
    type: select
    use:
      - Provider_1
      - Provider_2
      - Provider_3
      - Provider_4
      - Provider_5
      - Provider_6
