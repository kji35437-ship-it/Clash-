mixed-port: 7890
allow-lan: true
bind-address: "*"

mode: rule
log-level: info

ipv6: false

external-controller: 127.0.0.1:9090


# =====================
# DNS（按照INI优化）
# =====================

dns:
  enable: true
  ipv6: false

  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16

  default-nameserver:
    - 223.5.5.5
    - 114.114.114.114

  nameserver:
    - 223.5.5.5
    - 114.114.114.114

  fallback:
    - 1.1.1.1
    - 8.8.8.8

  fallback-filter:
    geoip: true
    geoip-code: CN


# =====================
# 七个订阅源
# =====================

proxy-providers:

  p1:
    type: http
    url: https://raw.githubusercontent.com/PuddinCat/BestClash/refs/heads/main/proxies.yaml
    interval: 3600
    path: ./providers/p1.yaml
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300


  p2:
    type: http
    url: https://raw.githubusercontent.com/chengaopan/AutoMergePublicNodes/master/list.meta.yml
    interval: 3600
    path: ./providers/p2.yaml
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300


  p3:
    type: http
    url: https://shz.al/JXxQ
    interval: 3600
    path: ./providers/p3.yaml


  p4:
    type: http
    url: https://tg.wxgqlfx.fun/wxzl
    interval: 3600
    path: ./providers/p4.yaml


  p5:
    type: http
    url: https://raw.githubusercontent.com/go4sharing/sub/main/sub.yaml
    interval: 3600
    path: ./providers/p5.yaml
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300


  p6:
    type: http
    url: https://proxy.v2gh.com/https://raw.githubusercontent.com/Pawdroid/Free-servers/main/sub
    interval: 3600
    path: ./providers/p6.yaml


  p7:
    type: http
    url: https://raw.githubusercontent.com/a2470982985/getNode/main/clash.yaml
    interval: 3600
    path: ./providers/p7.yaml
# =====================
# 极简策略组
# =====================

proxy-groups:


# 主入口
  - name: 🚀默认代理
    type: select
    proxies:
      - 🧠自动优选
      - 🖱手动选择
      - DIRECT


# 自动测速核心
  - name: 🧠自动优选
    type: url-test
    use:
      - p1
      - p2
      - p3
      - p4
      - p5
      - p6
      - p7

    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 80


# 手动选择
  - name: 🖱手动选择
    type: select
    use:
      - p1
      - p2
      - p3
      - p4
      - p5
      - p6
      - p7



# AI服务
  - name: ✨AI
    type: select
    proxies:
      - 🧠自动优选
      - 🖱手动选择
      - DIRECT



# 视频流媒体
  - name: 🎬流媒体
    type: select
    proxies:
      - 🧠自动优选
      - 🖱手动选择
      - DIRECT



# 社交服务
