# =====================
# 策略组
# =====================

proxy-groups:


# 总入口
  - name: 🚀 默认代理
    type: select
    proxies:
      - 🌐 全部自动
      - 🔧 手动选择
      - 🇭🇰 香港自动
      - 🇯🇵 日本自动
      - 🇸🇬 新加坡自动
      - 🇺🇸 美国自动
      - DIRECT


# AI统一
  - name: 🤖 AI
    type: select
    proxies:
      - 🌐 全部自动
      - 🇺🇸 美国自动
      - 🇯🇵 日本自动
      - 🇸🇬 新加坡自动
      - 🔧 手动选择
      - DIRECT


# 视频流媒体
