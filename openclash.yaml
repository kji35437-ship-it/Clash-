    type: select
    use:
      - BestClash
      - AutoMerge
      - SHZ
      - WXGQL
      - Go4Sharing
      - Pawdroid
      - GetNode



# 全部自动
  - name: 🌐 全部自动
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 180
    tolerance: 100
    use:
