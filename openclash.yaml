mixed-port: 7890
allow-lan: true
bind-address: "*"

mode: rule
log-level: info

ipv6: false

external-controller: 127.0.0.1:9090

unified-delay: true
tcp-concurrent: true

profile:
  store-selected: true
  store-fake-ip: true


# ======================
# DNS（按照你之前ini风格）
# ======================

dns:
  enable: true
  listen: 127.0.0.1:7874
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16

  default-nameserver:
    - 223.5.5.5
    - 114.114.114.114

  nameserver:
    - https://223.5.5.5/dns-query
    - https://1.1.1.1/dns-query

  fallback:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query

  fallback-filter:
    geoip: true
    geoip-code: CN


# ======================
# 订阅源
# ======================

proxy-providers:

  p1:
    type: http
    url: https://raw.githubusercontent.com/PuddinCat/BestClash/refs/heads/main/proxies.yaml
    interval: 3600
    path: ./providers/p1.yaml
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 300


  p2:
    type: http
    url: https://raw.githubusercontent.com/chengaopan/AutoMergePublicNodes/master/list.meta.yml
    interval: 3600
    path: ./providers/p2.yaml
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 300


  p3:
    type: http
    url: https://shz.al/JXxQ
    interval: 3600
    path: ./providers/p3.yaml


  p4:
    type: http
    url: https://tg.wxgqlfx.fun/wxzl
    interval: 3600
    path: ./providers/p4.yaml


  p5:
    type: http
    url: https://raw.githubusercontent.com/go4sharing/sub/main/sub.yaml
    interval: 3600
    path: ./providers/p5.yaml


  p6:
    type: http
    url: https://proxy.v2gh.com/https://raw.githubusercontent.com/Pawdroid/Free-servers/main/sub
    interval: 3600
    path: ./providers/p6.yaml


  p7:
    type: http
    url: https://raw.githubusercontent.com/a2470982985/getNode/main/clash.yaml
    interval: 3600
    path: ./providers/p7.yaml
proxy-groups:

# ======================
# 主入口
# ======================

- name: 🚀默认代理
  type: select
  proxies:
    - ⚡智能自动
    - 🖐手动选择
    - DIRECT


# ======================
# 自动测速核心
# ======================

- name: ⚡智能自动
  type: url-test
  use:
    - p1
    - p2
    - p3
    - p4
    - p5
    - p6
    - p7

  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 80

  filter: "(?i)(JP|Japan|日本|SG|Singapore|新加坡|US|United States|美国|DE|Germany|德国|UK|英国)"


# ======================
# 手动选择
# ======================

- name: 🖐手动选择
  type: select

  use:
    - p1
    - p2
    - p3
    - p4
    - p5
    - p6
    - p7


# ======================
# 视频专用
# ======================

- name: 🎬视频
  type: fallback

  proxies:
    - ⚡智能自动
    - 🖐手动选择

  url: http://www.gstatic.com/generate_204
  interval: 300


# ======================
# AI专用
# ======================

- name: 🤖AI
  type: fallback

  proxies:
    - ⚡智能自动
    - 🖐手动选择

  url: http://www.gstatic.com/generate_204
  interval: 300
rules:

# ======================
# AI
# ======================

