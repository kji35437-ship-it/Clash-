port: 7890
socks-port: 7891
mixed-port: 7893

allow-lan: true
bind-address: "*"

mode: rule
log-level: warning

ipv6: false

external-controller: 0.0.0.0:9090

unified-delay: true
tcp-concurrent: true

find-process-mode: strict

profile:
  store-selected: true
  store-fake-ip: true


# =====================
# DNS（按照INI风格）
# =====================

dns:
  enable: true
  listen: 127.0.0.1:7875

  ipv6: false

  enhanced-mode: fake-ip

  fake-ip-range: 198.18.0.1/16

  default-nameserver:
    - 223.5.5.5
    - 114.114.114.114

  nameserver:
    - https://223.5.5.5/dns-query
    - https://dns.alidns.com/dns-query

  fallback:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query

  fallback-filter:
    geoip: true
    geoip-code: CN

    ipcidr:
      - 240.0.0.0/4


# =====================
# 七个订阅源
# =====================

proxy-providers:


  PuddinCat:
    type: http
    url: https://raw.githubusercontent.com/PuddinCat/BestClash/refs/heads/main/proxies.yaml
    interval: 3600
    path: ./providers/PuddinCat.yaml

    health-check:
      enable: true
      url: https://cp.cloudflare.com/generate_204
      interval: 300

    header:
      User-Agent:
        - clash.meta


  AutoMerge:
    type: http
    url: https://raw.githubusercontent.com/chengaopan/AutoMergePublicNodes/master/list.meta.yml
    interval: 3600
    path: ./providers/AutoMerge.yaml

