# =====================================================
# OpenClash Mihomo 配置
# 基于 Lian.ini 转换
# 节点源：7订阅整合
# =====================================================

mixed-port: 7890
socks-port: 7891

allow-lan: true

bind-address: "*"

mode: rule

log-level: info

ipv6: false

tcp-concurrent: true

unified-delay: true

find-process-mode: strict

global-client-fingerprint: chrome

external-controller: 0.0.0.0:9090


# =====================================================
# Profile
# =====================================================

profile:
  store-selected: true
  store-fake-ip: true


# =====================================================
# Sniffer
# =====================================================

sniffer:
  enable: true
  sniff:
    HTTP:
      ports:
        - 80
        - 8080-8880
    TLS:
      ports:
        - 443
        - 8443


# =====================================================
# DNS
# 按 Lian.ini 逻辑
# =====================================================

dns:

  enable: true

  listen: 127.0.0.1:7874

  ipv6: false

  enhanced-mode: fake-ip

  fake-ip-range: 198.18.0.1/16


  default-nameserver:

    - 223.5.5.5
    - 114.114.114.114


  nameserver:

    - https://223.5.5.5/dns-query
    - https://dns.alidns.com/dns-query


  fallback:

    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
    - tls://1.0.0.1:853


  fallback-filter:

    geoip: true

    geoip-code: CN

    ipcidr:
      - 240.0.0.0/4



# =====================================================
# Proxy Providers
# 七个订阅源
# =====================================================

proxy-providers:


  BestClash:

