# =====================================================
# Proxy Groups
# 极简面板
# =====================================================


proxy-groups:


# =============================
# 总入口
# =============================

  - name: 🚀 默认代理

    type: select

    proxies:

      - 🎯 手动选择
      - ⚡自动测速
      - 🇭🇰 香港自动
      - 🇯🇵 日本自动
      - 🇸🇬 新加坡自动
      - 🇺🇸 美国自动
      - DIRECT



# =============================
# 手动选择
# =============================

  - name: 🎯 手动选择

    type: select

    use:

      - BestClash
      - AutoMergePublicNodes
      - SHZ
      - WXGQLFX
      - Go4Sharing
      - Pawdroid
      - A247



# =============================
# 总自动测速
# =============================

  - name: ⚡自动测速

    type: url-test

    url: https://www.gstatic.com/generate_204

    interval: 180

    tolerance: 100

    use:

      - BestClash
      - AutoMergePublicNodes
      - SHZ
      - WXGQLFX
      - Go4Sharing
      - Pawdroid
      - A247



# =============================
# 香港
# =============================

  - name: 🇭🇰 香港自动

    type: url-test

    url: https://www.gstatic.com/generate_204

    interval: 180

    tolerance: 100

    use:

      - BestClash
      - AutoMergePublicNodes
      - SHZ
      - WXGQLFX
      - Go4Sharing
      - Pawdroid
      - A247

    filter: >
      (?i)
      香港|
      HK|
      Hong Kong|
      HongKong|
      🇭🇰



