mixed-port: 7890
allow-lan: true
bind-address: "*"

mode: rule
log-level: info

ipv6: false

external-controller: 127.0.0.1:9090

unified-delay: true
tcp-concurrent: true

find-process-mode: strict

global-client-fingerprint: chrome


profile:
  store-selected: true
  store-fake-ip: true


# =====================
# DNS（按照你的 ini 优化）
# =====================

dns:
  enable: true
  listen: 127.0.0.1:7875

  ipv6: false

  enhanced-mode: fake-ip

  fake-ip-range: 198.18.0.1/16

  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "localhost.*"

  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  nameserver:
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query

  fallback:
    - https://1.1.1.1/dns-query
    - https://dns.google/dns-query
    - https://1.0.0.1/dns-query

  fallback-filter:
    geoip: true
    geoip-code: CN


# =====================
# 七个订阅源
# =====================

