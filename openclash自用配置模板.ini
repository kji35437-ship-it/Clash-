; ========= 精简规则集：保留国内+全球通用规则集，删掉一堆细分AI/油管独立ruleset =========
ruleset=➡️国内,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/China/China.list
ruleset=🌍国外,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Global/Global.list

; ========= 核心代理组（3个，删掉全部地区自动组） =========
; 🚀fallback‑优先代理：优先节点池，**全部代理探测失败才落到DIRECT**，视频首选
; 参数：间隔120秒，失败2次判定失效，探测超时2000ms
custom_proxy_group=🚀fallback‑优先代理`fallback`.*`[]DIRECT`http://www.gstatic.com/generate_204`120,2,2000

; ⚡url‑test‑最低延迟：每120s测速选延迟最低，适合网页浏览
custom_proxy_group=⚡url‑test‑最低延迟`url-test`.*`http://www.gstatic.com/generate_204`120,5,120

; ✋手动‑全部：手动挑选单个节点测试
custom_proxy_group=✋手动‑全部`select`.*

; ========= 业务策略组，仅保留2个对外显示的下拉 =========
custom_proxy_group=🌍国外`select`[]DIRECT`[]🚀fallback‑优先代理`[]⚡url‑test‑最低延迟`[]✋手动‑全部`[]REJECT
custom_proxy_group=➡️国内`select`[]DIRECT`[]REJECT

enable_rule_generator=true
overwrite_original_rules=true

# 拦截STUN 3478/5349，修复ping0.cc WebRTC泄露国内真实公网IP
- AND,(NETWORK,UDP),(DST-PORT,3478),REJECT-DROP
- AND,(NETWORK,UDP),(DST-PORT,5349),REJECT-DROP

# 兜底：所有未匹配域名交给【🌍国外】策略组
- MATCH,*,🌍国外
