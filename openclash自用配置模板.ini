ruleset=➡️国内,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/China/China.list
ruleset=🌍国外,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Global/Global.list

; 🚀fallback‑优先代理 追剧长视频用，只在节点彻底失效才切换
custom_proxy_group=🚀fallback‑优先代理`fallback`.*`[]DIRECT`https://cp.cloudflare.com/generate_204`300,3,3000,lazy=true

; ⚡url‑test‑最低延迟 默认，网页浏览自动选低延迟
custom_proxy_group=⚡url‑test‑最低延迟`url-test`.*`https://cp.cloudflare.com/generate_204`300,3,3000,150,lazy=true

; ✋手动‑全部：手动测试节点
custom_proxy_group=✋手动‑全部`select`.*

; url‑test放在第一位，重启内核默认启用网页模式
custom_proxy_group=🌍国外`select`[]⚡url‑test‑最低延迟`[]🚀fallback‑优先代理`[]✋手动‑全部`[]DIRECT`[]REJECT
custom_proxy_group=➡️国内`select`[]DIRECT`[]REJECT

enable_rule_generator=true
overwrite_original_rules=true

# 拦截STUN，防止ping0.cc WebRTC泄露真实IP
- AND,(NETWORK,UDP),(DST-PORT,3478),REJECT-DROP
- AND,(NETWORK,UDP),(DST-PORT,5349),REJECT-DROP

# 兜底：所有未匹配域名交给🌍国外
- MATCH,*,🌍国外
